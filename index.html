<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Descontos</title>
  <style>
    :root {
      --black: #111111;
      --white: #ffffff;
      --gray: #777777;
      --line: #dedede;
      --red: #e53935;
      --blue: #2878e8;
      --green: #269b57;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f4f4;
      color: var(--black);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(760px, 100%);
      min-height: 430px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      background: var(--white);
      border: 1px solid var(--line);
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.08);
    }

    .main {
      padding: clamp(28px, 6vw, 52px);
    }

    .eyebrow {
      margin: 0 0 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gray);
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 4vw, 38px);
      line-height: 1.08;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .intro {
      margin: 12px 0 34px;
      max-width: 360px;
      color: var(--gray);
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .price-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 0 12px;
      border-bottom: 2px solid var(--black);
    }

    .currency {
      font-size: 18px;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--black);
      font: inherit;
      font-size: 25px;
      font-weight: 600;
      min-width: 0;
    }

    input::placeholder { color: #b8b8b8; }

    .hint {
      margin: 9px 0 0;
      color: var(--gray);
      font-size: 12px;
    }

    .result {
      margin-top: 36px;
      padding-top: 25px;
      border-top: 1px solid var(--line);
    }

    .result-label {
      margin: 0 0 8px;
      color: var(--gray);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .result-price {
      margin: 0;
      font-size: clamp(36px, 6vw, 48px);
      font-weight: 700;
      letter-spacing: -0.05em;
      overflow-wrap: anywhere;
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 14px;
      color: #555;
      font-size: 13px;
    }

    .details strong { color: var(--black); }

    .side {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 27px;
      padding: 24px 16px;
      background: var(--black);
      color: var(--white);
    }

    .side-title {
      margin: 0 0 3px;
      font-size: 10px;
      line-height: 1.5;
      text-align: center;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #c7c7c7;
    }

    .discount-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--white);
      cursor: pointer;
      font: inherit;
    }

    .circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 3px solid transparent;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .discount-option:hover .circle { transform: scale(1.07); }

    .discount-option[aria-pressed="true"] .circle {
      border-color: var(--white);
      box-shadow: 0 0 0 3px var(--black), 0 0 0 5px var(--white);
    }

    .circle.red { background: var(--red); }
    .circle.blue { background: var(--blue); }
    .circle.green { background: var(--green); }

    .percent {
      font-size: 14px;
      font-weight: 700;
    }

    .off {
      font-size: 10px;
      letter-spacing: 0.13em;
      color: #d2d2d2;
    }

    .status {
      min-height: 18px;
      margin-top: 14px;
      color: var(--gray);
      font-size: 12px;
    }

    @media (max-width: 540px) {
      body { padding: 12px; }
      .app { grid-template-columns: 1fr; }
      .main { padding: 28px 24px; }
      .side {
        flex-direction: row;
        justify-content: space-evenly;
        gap: 12px;
        padding: 20px 12px;
      }
      .side-title { display: none; }
      .discount-option { width: auto; }
      .circle { width: 50px; height: 50px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="main">
      <p class="eyebrow">Ferramenta de consulta</p>
      <h1>Calculadora<br />de descontos</h1>
      <p class="intro">Digite o preço original e selecione o desconto desejado.</p>

      <label for="price">Preço original</label>
      <div class="price-wrap">
        <span class="currency">R$</span>
        <input id="price" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off" aria-describedby="price-hint" />
      </div>
      <p class="hint" id="price-hint">Você pode usar vírgula ou ponto nos centavos.</p>

      <section class="result" aria-live="polite">
        <p class="result-label">Preço com desconto</p>
        <p class="result-price" id="result">R$ 0,00</p>
        <div class="details">
          <span>Desconto: <strong id="discount-value">—</strong></span>
          <span>Economia: <strong id="savings">R$ 0,00</strong></span>
        </div>
        <p class="status" id="status">Selecione uma porcentagem ao lado.</p>
      </section>
    </section>

    <aside class="side" aria-label="Escolha o percentual de desconto">
      <p class="side-title">Selecione<br />o desconto</p>
      <button class="discount-option" type="button" data-discount="60" aria-label="Aplicar 60 por cento de desconto" aria-pressed="false">
        <span class="circle red"></span>
        <span class="percent">60%</span>
        <span class="off">OFF</span>
      </button>
      <button class="discount-option" type="button" data-discount="50" aria-label="Aplicar 50 por cento de desconto" aria-pressed="false">
        <span class="circle blue"></span>
        <span class="percent">50%</span>
        <span class="off">OFF</span>
      </button>
      <button class="discount-option" type="button" data-discount="40" aria-label="Aplicar 40 por cento de desconto" aria-pressed="false">
        <span class="circle green"></span>
        <span class="percent">40%</span>
        <span class="off">OFF</span>
      </button>
    </aside>
  </main>

  <script>
    const priceInput = document.getElementById("price");
    const resultEl = document.getElementById("result");
    const discountValueEl = document.getElementById("discount-value");
    const savingsEl = document.getElementById("savings");
    const statusEl = document.getElementById("status");
    const discountButtons = document.querySelectorAll(".discount-option");

    let selectedDiscount = null;

    const money = (value) => new Intl.NumberFormat("pt-BR", {
      style: "currency",
      currency: "BRL"
    }).format(value);

    function parsePrice(raw) {
      let value = raw.trim().replace(/[R$\s]/g, "");
      if (!value) return null;

      // Se houver vírgula, ela será tratada como separador decimal.
      // Sem vírgula, um ponto final com 1 ou 2 dígitos será decimal.
      if (value.includes(",")) {
        value = value.replace(/\./g, "").replace(",", ".");
      } else if (/^\d+\.\d{1,2}$/.test(value)) {
        // Ex.: 599.90
      } else {
        value = value.replace(/\./g, "");
      }

      const number = Number(value);
      return Number.isFinite(number) && number >= 0 ? number : null;
    }

    function calculate() {
      const originalPrice = parsePrice(priceInput.value);

      if (originalPrice === null) {
        resultEl.textContent = "R$ 0,00";
        discountValueEl.textContent = "—";
        savingsEl.textContent = "R$ 0,00";
        statusEl.textContent = priceInput.value.trim()
          ? "Digite um preço válido."
          : "Digite o preço e selecione um desconto.";
        return;
      }

      if (selectedDiscount === null) {
        resultEl.textContent = money(originalPrice);
        discountValueEl.textContent = "—";
        savingsEl.textContent = "R$ 0,00";
        statusEl.textContent = "Agora, selecione uma porcentagem ao lado.";
        return;
      }

      // Arredonda para centavos para evitar diferenças de precisão decimal.
      const finalPrice = Math.round((originalPrice * (1 - selectedDiscount / 100) + Number.EPSILON) * 100) / 100;
      const savings = Math.round((originalPrice - finalPrice + Number.EPSILON) * 100) / 100;

      resultEl.textContent = money(finalPrice);
      discountValueEl.textContent = `${selectedDiscount}% OFF`;
      savingsEl.textContent = money(savings);
      statusEl.textContent = "Desconto aplicado com sucesso.";
    }

    discountButtons.forEach((button) => {
      button.addEventListener("click", () => {
        selectedDiscount = Number(button.dataset.discount);
        discountButtons.forEach((item) => {
          item.setAttribute("aria-pressed", String(item === button));
        });
        calculate();
      });
    });

    priceInput.addEventListener("input", calculate);
    priceInput.addEventListener("blur", () => {
      const value = parsePrice(priceInput.value);
      if (value !== null && priceInput.value.trim()) {
        priceInput.value = value.toLocaleString("pt-BR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }
      calculate();
    });
  </script>
</body>
</html>
